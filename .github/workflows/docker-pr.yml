name: Docker PR Test

on:
  pull_request:
    branches:
      - main

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t docker-pr-demo:test .

      - name: Show Docker image
        run: |
          docker images

      - name: Start Docker container
        run: |
          docker run -d \
            --name docker-pr-demo \
            -p 5000:5000 \
            docker-pr-demo:test

      - name: Show running container
        run: |
          docker ps

      - name: Test application
        run: |
          sleep 5
          curl http://localhost:5000

      - name: Stop container
        if: always()
        run: |
          docker stop docker-pr-demo || true
