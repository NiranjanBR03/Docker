name: Docker Main Build

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t docker-pr-demo:${{ github.sha }} .

      - name: Show Docker image
        run: |
          docker images

      - name: Test Docker image
        run: |
          docker run -d \
            --name docker-pr-demo \
            -p 5000:5000 \
            docker-pr-demo:${{ github.sha }}

          sleep 5

          curl http://localhost:5000

      - name: Stop container
        if: always()
        run: |
          docker stop docker-pr-demo || true