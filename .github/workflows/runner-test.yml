
name: Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check computer
        run: hostname
        shell: cmd

      - name: Check Docker version
        run: docker --version
        shell: cmd

      - name: Check running containers
        run: docker ps
        shell: cmd

      - name: Check Python
        run: python --version
        shell: cmd

      - name: Check Docker using full path
        run: '"C:\Users\DELL\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" --version'
        shell: cmd
