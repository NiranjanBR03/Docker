
name: Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check computer
        shell: cmd
        run: hostname

      - name: Add Docker to PATH
        shell: cmd
        run: echo C:\Users\DELL\AppData\Local\Programs\DockerDesktop\resources\bin>>"%GITHUB_PATH%"

      - name: Check Docker version
        shell: cmd
        run: docker --version

      - name: Check running containers
        shell: cmd
        run: docker ps

      - name: Check Python
        shell: cmd
        run: python --version
