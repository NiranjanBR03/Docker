```yaml
name: Self Hosted Runner Test

on:
  workflow_dispatch: {}

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Check Windows user
        run: whoami
        shell: cmd

      - name: Check Docker version
        run: docker --version
        shell: cmd

      - name: Check Docker engine
        run: docker info
        shell: cmd
```
